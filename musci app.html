```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave Music</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0f;
      color: white;
      padding-bottom: 100px;
    }

    /* =========================
       APP HEADER
    ========================= */

    .app-header {
      padding: 22px 18px 15px;
      position: sticky;
      top: 0;
      background: rgba(11, 11, 15, 0.95);
      backdrop-filter: blur(15px);
      z-index: 10;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title {
      font-size: 25px;
      font-weight: 800;
    }

    .profile {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      margin-top: 18px;
      display: flex;
      align-items: center;
      background: #1b1b22;
      border-radius: 14px;
      padding: 12px 15px;
    }

    .search-box span {
      font-size: 18px;
      margin-right: 10px;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
    }

    /* =========================
       MAIN CONTENT
    ========================= */

    main {
      padding: 10px 18px;
    }

    .section {
      margin-top: 25px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-header h2 {
      font-size: 20px;
    }

    .section-header a {
      color: #a855f7;
      font-size: 13px;
      text-decoration: none;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      height: 190px;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 15px;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.55);
    }

    .hero-content {
      position: absolute;
      bottom: 20px;
      left: 20px;
    }

    .hero-content p {
      color: #ddd;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .hero-content h1 {
      font-size: 25px;
    }

    .play-button {
      margin-top: 12px;
      background: #a855f7;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 10px 22px;
      font-weight: bold;
      cursor: pointer;
    }

    /* =========================
       HORIZONTAL CARDS
    ========================= */

    .horizontal-list {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .horizontal-list::-webkit-scrollbar {
      display: none;
    }

    .album-card {
      min-width: 140px;
    }

    .album-card img {
      width: 140px;
      height: 140px;
      border-radius: 15px;
      object-fit: cover;
    }

    .album-card h3 {
      font-size: 14px;
      margin-top: 9px;
    }

    .album-card p {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    /* =========================
       ARTISTS
    ========================= */

    .artist-card {
      min-width: 100px;
      text-align: center;
    }

    .artist-card img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
    }

    .artist-card p {
      font-size: 13px;
      margin-top: 8px;
    }

    /* =========================
       SONG LIST
    ========================= */

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 12px;
    }

    .song:hover {
      background: #19191f;
    }

    .song img {
      width: 55px;
      height: 55px;
      border-radius: 10px;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
    }

    .song-info h3 {
      font-size: 14px;
    }

    .song-info p {
      color: #888;
      font-size: 12px;
      margin-top: 5px;
    }

    .song button {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    /* =========================
       MUSIC PLAYER
    ========================= */

    .music-player {
      position: fixed;
      bottom: 65px;
      left: 10px;
      right: 10px;
      background: rgba(30, 30, 38, 0.97);
      backdrop-filter: blur(15px);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .music-player img {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
    }

    .player-info {
      flex: 1;
      overflow: hidden;
    }

    .player-info h4 {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-info p {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }

    .player-controls button {
      background: none;
      color: white;
      border: none;
      font-size: 22px;
      cursor: pointer;
    }

    /* =========================
       BOTTOM NAVIGATION
    ========================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #121217;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 30;
      border-top: 1px solid #24242c;
    }

    .nav-item {
      text-align: center;
      color: #777;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-item span {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }

    .nav-item.active {
      color: #a855f7;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (min-width: 700px) {
      body {
        max-width: 600px;
        margin: auto;
      }

      .bottom-nav {
        max-width: 600px;
        margin: auto;
      }

      .music-player {
        max-width: 580px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header class="app-header">

    <div class="header-row">
      <div class="app-title">Wave Music</div>

      <img
        class="profile"
        src="https://i.pravatar.cc/100?img=12"
        alt="Profile"
      />
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input
        type="text"
        id="searchInput"
        placeholder="Search songs, artists..."
      />
    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <!-- HERO -->

    <section class="hero">

      <img
        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f"
        alt="Featured music"
      />

      <div class="hero-content">
        <p>Featured Playlist</p>
        <h1>Feel Good Hits</h1>

        <button class="play-button" onclick="playSong(0)">
          ▶ Play Now
        </button>
      </div>

    </section>


    <!-- TRENDING -->

    <section class="section">

      <div class="section-header">
        <h2>Trending Albums</h2>
        <a href="#">See All</a>
      </div>

      <div class="horizontal-list" id="albumsList"></div>

    </section>


    <!-- ARTISTS -->

    <section class="section">

      <div class="section-header">
        <h2>Popular Artists</h2>
        <a href="#">See All</a>
      </div>

      <div class="horizontal-list" id="artistsList"></div>

    </section>


    <!-- SONGS -->

    <section class="section">

      <div class="section-header">
        <h2>Recently Played</h2>
        <a href="#">See All</a>
      </div>

      <div class="song-list" id="songsList"></div>

    </section>

  </main>


  <!-- =========================
       MINI MUSIC PLAYER
  ========================= -->

  <div class="music-player">

    <img
      id="playerImage"
      src="https://picsum.photos/100?random=1"
      alt="Current song"
    />

    <div class="player-info">
      <h4 id="playerTitle">Select a song</h4>
      <p id="playerArtist">Wave Music</p>
    </div>

    <div class="player-controls">
      <button onclick="previousSong()">⏮</button>
      <button onclick="togglePlay()" id="playPause">▶</button>
      <button onclick="nextSong()">⏭</button>
    </div>

  </div>


  <!-- =========================
       BOTTOM NAVIGATION
  ========================= -->

  <nav class="bottom-nav">

    <div class="nav-item active">
      <span>⌂</span>
      Home
    </div>

    <div class="nav-item">
      <span>🔍</span>
      Search
    </div>

    <div class="nav-item">
      <span>♡</span>
      Library
    </div>

    <div class="nav-item">
      <span>☰</span>
      Playlists
    </div>

  </nav>


  <!-- =========================
       DATA + JAVASCRIPT
  ========================= -->

  <script>

    // Sample album data

    const albums = [
      {
        title: "Midnight Dreams",
        artist: "Luna Ray",
        image: "https://picsum.photos/300?random=10"
      },
      {
        title: "Ocean Drive",
        artist: "The Waves",
        image: "https://picsum.photos/300?random=11"
      },
      {
        title: "Neon Nights",
        artist: "Alex Stone",
        image: "https://picsum.photos/300?random=12"
      },
      {
        title: "Golden Hour",
        artist: "Mia Rose",
        image: "https://picsum.photos/300?random=13"
      }
    ];


    // Sample artist data

    const artists = [
      {
        name: "Luna Ray",
        image: "https://i.pravatar.cc/200?img=47"
      },
      {
        name: "Alex Stone",
        image: "https://i.pravatar.cc/200?img=12"
      },
      {
        name: "Mia Rose",
        image: "https://i.pravatar.cc/200?img=32"
      },
      {
        name: "The Waves",
        image: "https://i.pravatar.cc/200?img=56"
      }
    ];


    // Sample song data

    const songs = [
      {
        title: "Midnight Dreams",
        artist: "Luna Ray",
        album: "Midnight Dreams",
        image: "https://picsum.photos/100?random=20"
      },
      {
        title: "Ocean Drive",
        artist: "The Waves",
        album: "Ocean Drive",
        image: "https://picsum.photos/100?random=21"
      },
      {
        title: "Neon Lights",
        artist: "Alex Stone",
        album: "Neon Nights",
        image: "https://picsum.photos/100?random=22"
      },
      {
        title: "Golden Hour",
        artist: "Mia Rose",
        album: "Golden Hour",
        image: "https://picsum.photos/100?random=23"
      },
      {
        title: "Summer Rain",
        artist: "Luna Ray",
        album: "Summer Collection",
        image: "https://picsum.photos/100?random=24"
      }
    ];


    let currentSong = 0;
    let isPlaying = false;


    // =========================
    // RENDER ALBUMS
    // =========================

    const albumsList = document.getElementById("albumsList");

    albums.forEach(album => {

      albumsList.innerHTML += `
        <div class="album-card">

          <img
            src="${album.image}"
            alt="${album.title}"
          />

          <h3>${album.title}</h3>

          <p>${album.artist}</p>

        </div>
      `;

    });


    // =========================
    // RENDER ARTISTS
    // =========================

    const artistsList = document.getElementById("artistsList");

    artists.forEach(artist => {

      artistsList.innerHTML += `
        <div class="artist-card">

          <img
            src="${artist.image}"
            alt="${artist.name}"
          />

          <p>${artist.name}</p>

        </div>
      `;

    });


    // =========================
    // RENDER SONGS
    // =========================

    const songsList = document.getElementById("songsList");

    function renderSongs(songData = songs) {

      songsList.innerHTML = "";

      songData.forEach((song, index) => {

        songsList.innerHTML += `

          <div class="song">

            <img
              src="${song.image}"
              alt="${song.title}"
            />

            <div class="song-info">

              <h3>${song.title}</h3>

              <p>${song.artist} • ${song.album}</p>

            </div>

            <button onclick="playSong(${songs.indexOf(song)})">
              ▶
            </button>

          </div>

        `;

      });

    }

    renderSongs();


    // =========================
    // PLAY SONG
    // =========================

    function playSong(index) {

      currentSong = index;

      const song = songs[currentSong];

      document.getElementById("playerImage").src = song.image;

      document.getElementById("playerTitle").textContent =
        song.title;

      document.getElementById("playerArtist").textContent =
        song.artist;

      isPlaying = true;

      document.getElementById("playPause").textContent = "⏸";

    }


    // =========================
    // PLAY / PAUSE
    // =========================

    function togglePlay() {

      if (!songs.length) return;

      isPlaying = !isPlaying;

      document.getElementById("playPause").textContent =
        isPlaying ? "⏸" : "▶";

    }


    // =========================
    // NEXT SONG
    // =========================

    function nextSong() {

      currentSong++;

      if (currentSong >= songs.length) {
        currentSong = 0;
      }

      playSong(currentSong);

    }


    // =========================
    // PREVIOUS SONG
    // =========================

    function previousSong() {

      currentSong--;

      if (currentSong < 0) {
        currentSong = songs.length - 1;
      }

      playSong(currentSong);

    }


    // =========================
    // SEARCH
    // =========================

    document
      .getElementById("searchInput")
      .addEventListener("input", function () {

        const searchTerm =
          this.value.toLowerCase();

        const filteredSongs =
          songs.filter(song =>
            song.title.toLowerCase().includes(searchTerm) ||
            song.artist.toLowerCase().includes(searchTerm) ||
            song.album.toLowerCase().includes(searchTerm)
          );

        renderSongs(filteredSongs);

      });


    // =========================
    // NAVIGATION
    // =========================

    const navItems =
      document.querySelectorAll(".nav-item");

    navItems.forEach(item => {

      item.addEventListener("click", function () {

        navItems.forEach(nav =>
          nav.classList.remove("active")
        );

        this.classList.add("active");

      });

    });

  </script>

</body>
</html>
```
