<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap');

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  padding: 36px;
  color: #555;
  background-color: #ececec;
  font-size: clamp(1rem, 2vw, 2.5rem);
  font-smoothing: antialiased;
  font-family: "Space Grotesk", sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 36px;

  @media (max-width: 600px) {
    flex-direction: column;
    justify-content: flex-start;

    .card {
      width: 240px;
    }
  }
}

.card {
  flex-shrink: 0;
  width: min(25vw, 240px);
  aspect-ratio: 1/2;
  overflow: hidden;

  background-color: #fcfcfc;
  box-shadow: 2px 2px 12px #0003;

  display: flex;
  flex-direction: column;

  --corner-size: 30px;
  border-bottom-right-radius: var(--corner-size);
  corner-shape: bevel;
  position: relative;

  &:before { 
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: var(--corner-size);
    aspect-ratio: 1/1;
    background-image: linear-gradient(135deg, var(--color-1) 51%, transparent 0);
  }
}

.preview {
  width: 100%;
  aspect-ratio: 1/1;
}

.radial {
  --color-1: LightSalmon;
  --color-2: Coral;

  .preview {
    position: relative;
    overflow: hidden;

    &:before {
      content: '';
      position: absolute;
      top: 40%;
      left: 60%;
      translate: -50% -50%;

      width: 200%;
      height: 200%;
      rotate: 45deg;
      background: repeating-radial-gradient(var(--color-1) 0 12px, var(--color-2) 12px 24px) center / 150% 100%;
    }
  }
}

.linear {
  --color-1: CornflowerBlue;
  --color-2: RoyalBlue;

  .preview {
    background: repeating-linear-gradient(-45deg, var(--color-1) 0 10px, var(--color-2) 10px 20px) center / auto;
  }

}

.conic {
  --color-1: MediumSeaGreen;
  --color-2: SeaGreen;

  .preview {
    background: repeating-conic-gradient(at 80% 75%, var(--color-1) 0 6deg, var(--color-2) 6deg 12deg) center / auto;
  }
}

.content {
  flex: 1;
  padding: 16px 20px;

  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;

  .number {
    color: #222;
    font-size: 1.2em;
  }
  .desc {
    padding-right: var(--corner-size);
    text-wrap: pretty;
    font-size: max(10px, 0.5em);
    line-height: 1.3;
  }
}

</style>
</head>
<div class="card radial">
  <div class="preview"></div>
    <div class="content">
    <div class="number">01</div>
    <div class="desc">Radial gradient is ideal for highlighting a focal point by radiating colors outward from the center.</div>
  </div>
</div>

<div class="card linear">
  <div class="preview"></div>
  <div class="content">
    <div class="number">02</div>
    <div class="desc">Linear gradient is best for creating smooth directional transitions between colors.</div>
  </div>
</div>

<div class="card conic">
  <div class="preview"></div>
    <div class="content">
    <div class="number">03</div>
    <div class="desc">Conic gradient works well for circular or pie-chart-like color transitions around a center point.</div>
  </div>
</div>

</body>
</html>
