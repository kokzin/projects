<!DOCTYPE html>
<html>
<body>

  <h1>User Details</h1>
  <div id="output"></div>

  <script>
    fetch("data.json")
      .then(response => response.json())
      .then(data => {
        document.getElementById("output").innerHTML = `
          <p>Name: ${data.name}</p>
          <p>Age: ${data.age}</p>
          <p>City: ${data.city}</p>
        `;
      })
      .catch(error => {
        console.error("Error loading JSON:", error);
      });
  </script>

</body>
</html>
