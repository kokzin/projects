<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kasi Food</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div>
        <h1 id="app-name">Kasi Food</h1>
        <p id="app-tagline">Taste the flavour of home</p>
      </div>

      <button class="cart-button">
        🛒 <span id="cart-count">0</span>
      </button>
    </header>


    <!-- Search -->
    <div class="search-box">
      <input
        type="text"
        id="search-input"
        placeholder="Search for food..."
      >
    </div>


    <!-- Categories -->
    <section>
      <h2>Categories</h2>

      <div id="categories" class="categories">
        <!-- Categories generated by JavaScript -->
      </div>
    </section>


    <!-- Popular Food -->
    <section>
      <div class="section-header">
        <h2>Popular Near You</h2>
        <button id="view-all">View All</button>
      </div>

      <div id="food-list" class="food-list">
        <!-- Food cards generated by JavaScript -->
      </div>
    </section>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button>🏠<span>Home</span></button>
      <button>🔍<span>Explore</span></button>
      <button>🛒<span>Cart</span></button>
      <button>👤<span>Profile</span></button>
    </nav>

  </div>

  <script src="app.js"></script>

</body>
</html>
